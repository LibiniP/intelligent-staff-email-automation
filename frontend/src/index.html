<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Email Automation</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mute:#6b7685; --line:#e2e6ec; --accent:#8c1c3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --card:#1d232c; --ink:#e8ecf2; --mute:#98a2b1; --line:#2c3440; --accent:#e0607e; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  button, select { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.on, button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; overflow-x:auto; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  .mute { color:var(--mute); font-size:13px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  pre { white-space:pre-wrap; font:inherit; margin:10px 0; }
  textarea, input { width:100%; font:inherit; padding:8px; margin:6px 0; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>Staff Email Automation</h1>
  <nav id="tabs"></nav>
  <span><select id="role"><option>hr</option><option>reviewer</option><option>coordinator</option><option>admin</option></select>
  <button id="scan">Scan</button> <button id="dispatch">Dispatch</button></span>
</header>
<main id="view"></main>
<script>
const TABS = ["Drafts", "Upcoming", "Analytics", "Audit"];
let tab = "Drafts";
const $ = (id) => document.getElementById(id);

async function api(path, method = "GET", body) {
  const res = await fetch("/api" + path, {
    method,
    headers: { "Content-Type": "application/json", "X-User": "dashboard", "X-Role": $("role").value },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); alert(e.detail || res.statusText); throw new Error(res.status); }
  return res.json();
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "onclick" ? (e.onclick = v) : e.setAttribute(k, v);
  for (const kid of kids) e.append(kid);
  return e;
}

function table(heads, rows) {
  const t = el("table", {}, el("tr", {}, ...heads.map((h) => el("th", {}, h))));
  rows.forEach((r) => t.append(el("tr", {}, ...r.map((x) => el("td", {}, String(x ?? ""))))));
  return el("div", { class: "card" }, t);
}

function renderTabs() {
  $("tabs").replaceChildren(...TABS.map((t) =>
    el("button", { class: t === tab ? "on" : "", onclick: () => { tab = t; load(); } }, t)));
}

async function load() {
  renderTabs();
  const v = $("view"); v.replaceChildren();
  if (tab === "Drafts") {
    const drafts = await api("/drafts");
    if (!drafts.length) v.append(el("p", { class: "mute" }, "No drafts yet. Click Scan."));
    drafts.forEach((d) => v.append(draftCard(d)));
  } else if (tab === "Upcoming") {
    const rows = await api("/upcoming?days=60");
    v.append(table(["Date", "Staff", "Department", "Occasion"], rows.map((r) => [r.date, r.staff, r.department, r.occasion + (r.years ? ` (${r.years}y)` : "")])));
  } else if (tab === "Analytics") {
    const a = await api("/analytics");
    v.append(el("div", { class: "card" }, el("pre", {}, "By status\n" + JSON.stringify(a.by_status, null, 2) + "\n\nBy occasion\n" + JSON.stringify(a.by_occasion, null, 2))));
  } else {
    const rows = await api("/audit");
    v.append(table(["When", "Draft", "Actor", "Action", "Detail"], rows.map((r) => [r.at.slice(0, 16), r.draft_id, r.actor, r.action, r.detail])));
  }
}

function draftCard(d) {
  const act = (path) => async () => { await api(`/drafts/${d.id}/${path}`, "POST"); load(); };
  const card = el("div", { class: "card" },
    el("div", { class: "row" },
      el("strong", {}, `${d.staff} · ${d.occasion.replace("_", " ")}`),
      el("span", { class: "tag" }, d.status)),
    el("div", { class: "mute" }, `${d.department} · ${d.occasion_date} · to ${d.to} · ${d.generated_by}`),
    el("strong", {}, d.subject),
    el("pre", {}, d.body));
  if (d.error) card.append(el("div", { class: "mute" }, "Error: " + d.error));
  if (d.status === "pending") {
    const subj = el("input", { value: d.subject }), body = el("textarea", { rows: 6 }, d.body);
    const save = el("button", { onclick: async () => { await api(`/drafts/${d.id}/edit`, "POST", { subject: subj.value, body: body.value }); load(); } }, "Save edit");
    card.append(el("div", { class: "row" },
      el("button", { class: "primary", onclick: act("approve") }, "Approve"),
      el("button", { onclick: act("reject") }, "Reject"),
      el("button", { onclick: () => card.append(subj, body, save) }, "Edit")));
  } else if (d.status === "scheduled") {
    card.append(el("div", { class: "row" }, el("span", { class: "mute" }, "Sends " + d.scheduled_for), el("button", { onclick: act("cancel") }, "Cancel")));
  }
  return card;
}

$("scan").onclick = async () => { const r = await api("/jobs/scan", "POST"); alert(`${r.created} new draft(s)`); load(); };
$("dispatch").onclick = async () => { const r = await api("/jobs/dispatch", "POST"); alert(`${r.sent} sent`); load(); };
$("role").onchange = load;
load();
</script>
</body>
</html>
